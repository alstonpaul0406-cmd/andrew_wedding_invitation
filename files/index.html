<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf2">
<meta name="color-scheme" content="light">
<title>Andrew &amp; Teena — Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf2;--bg2:#f7ecd8;--card:#fffdf8;--ink:#3b2a2a;--muted:#6b5a4e;
  --maroon:#7a1f2b;--maroon2:#5a1420;--gold:#b8860b;--gold2:#e0b84f;
  --line:rgba(184,134,11,.38);
  --serif:"Cormorant Garamond","Noto Sans Tamil",Georgia,serif;
  --script:"Great Vibes","Noto Sans Tamil",cursive;
  --sans:"Jost","Noto Sans Tamil",system-ui,sans-serif;
  box-sizing:border-box;color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 50% 0,rgba(224,184,79,.18),transparent 55%);
  color:var(--ink);font-family:var(--sans);line-height:1.7;overflow-x:hidden;
}
body.locked{height:100vh;overflow:hidden}
button,.btn{font:500 1rem var(--sans);cursor:pointer;border:0;border-radius:999px;padding:13px 26px;background:var(--maroon);color:var(--bg);text-decoration:none;display:inline-block}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
.ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2}
section{padding:76px 22px;max-width:620px;margin:0 auto;text-align:center}
section+section{border-top:1px solid var(--line)}
h2{font-size:2.2rem;color:var(--maroon);margin-bottom:12px}
h2:after{content:"✦";display:block;font-size:.8rem;color:var(--gold);margin-top:7px}
p{color:var(--muted)}
.amp{color:var(--gold);font-style:italic}
.lang{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:70;
  display:flex;border:1px solid var(--maroon);border-radius:999px;overflow:hidden;background:var(--bg)
}
.lang button{padding:8px 14px;font-size:.88rem;background:transparent;color:var(--maroon);border-radius:0}
.lang button[aria-pressed=true]{background:var(--maroon);color:var(--bg)}

.cover{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:22px;background:var(--bg);
  background-image:radial-gradient(circle at 50% 30%,rgba(224,184,79,.25),transparent 60%);
  transition:opacity 1s ease,transform 1.2s ease;overflow:auto
}
.cover:before{content:"";position:absolute;inset:14px;border:1px solid var(--line);border-radius:8px;pointer-events:none;z-index:1}
.cover.open{opacity:0;transform:scale(1.06);pointer-events:none}
.cover.gone{display:none}

/* Video background on the "tap the seal" cover */
.cover-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:28% center; /* keeps the couple + heart balloon in view */
  z-index:0;pointer-events:none;
}
/* Portrait phones: video fills the top, text sits below it so the couple is never hidden */
@media (max-aspect-ratio:1/1){
  .cover{padding-top:calc(env(safe-area-inset-top,0px) + 41svh)}
  .cover-bg{
    height:46svh;bottom:auto;
    -webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);
  }
  .seal{margin-top:auto}
}

.seal{
  width:min(92vw,390px);position:relative;z-index:2;
  padding:24px 0;
  background:radial-gradient(closest-side,rgba(255,250,242,.75),rgba(255,250,242,0)); /* soft glow keeps text readable over the flowers */
}
.seal .cross{color:var(--gold)}
.seal h1{font:400 clamp(2.8rem,14vw,4rem) var(--script);color:var(--maroon);margin:10px 0 0;line-height:1.2}
.seal p{margin:8px 0}
.waxseal{
  margin:22px auto 12px;width:128px;height:128px;border:0;padding:0;border-radius:52% 48% 50% 50%/50% 52% 48% 50%;
  background:radial-gradient(circle at 35% 30%,#b3394a,#7a1f2b 60%,#5a1420);color:var(--gold2);
  font:600 2rem var(--serif);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 10px 22px rgba(90,20,32,.35),inset 0 0 0 7px rgba(224,184,79,.22),inset 0 0 0 8px rgba(90,20,32,.45);
  animation:pulse 2.4s ease-in-out infinite
}
@keyframes pulse{50%{transform:scale(1.06)}}

.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding-top:86px}
.hero-art{
  width:min(94vw,580px);aspect-ratio:1/1;border-radius:28px;object-fit:cover;
  border:2px solid var(--gold);box-shadow:0 18px 50px rgba(90,20,32,.16),0 0 0 8px rgba(184,134,11,.09);
  animation:artFloat 7s ease-in-out infinite;transform-origin:center;
}
@keyframes artFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.018)}
}
.hero-art-wrap{position:relative;margin-bottom:8px}

/* Speech Bubbles Overlay Styles */
.speech-bubble {
  position: absolute;
  background: var(--card);
  border: 1.5px solid var(--gold);
  padding: 10px 14px;
  border-radius: 14px;
  font-family: var(--serif);
  font-size: 0.95rem;
  font-style: italic;
  color: var(--maroon);
  box-shadow: 0 8px 22px rgba(90,20,32,0.18);
  max-width: 200px;
  text-align: center;
  z-index: 5;
  opacity: 0;
  transform: translateY(12px) scale(0.9);
  animation: bubblePopIn 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, bubbleFloat 4s ease-in-out infinite alternate;
}
.speech-bubble:after {
  content: "";
  position: absolute;
  bottom: -8px;
  width: 12px;
  height: 12px;
  background: var(--card);
  border-right: 1.5px solid var(--gold);
  border-bottom: 1.5px solid var(--gold);
}
.speech-bubble.groom-bubble {
  bottom: 44%;
  right: 4%;
  animation-delay: 1s, 1.75s;
}
.speech-bubble.groom-bubble:after {
  right: 20px;
  transform: rotate(45deg);
}
.speech-bubble.bride-bubble {
  bottom: 12%;
  left: 4%;
  animation-delay: 4s, 4.75s;
}
.speech-bubble.bride-bubble:after {
  left: 20px;
  transform: rotate(45deg);
}
@keyframes bubblePopIn {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes bubbleFloat {
  0% { transform: translateY(0); }
  100% { transform: translateY(-6px); }
}

.hero-art-wrap:after{
  content:"✦  ✝  ✦";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);
  color:var(--gold);font-size:1.15rem;letter-spacing:.28em;background:var(--bg);padding:0 10px
}
.tag{font:600 1.45rem var(--serif);color:var(--maroon)}
.q{font-size:.95rem}
.orn{color:var(--gold);letter-spacing:.5em;font-size:.8rem}
.who{font:400 clamp(2.5rem,11vw,3.6rem) var(--script);color:var(--maroon);line-height:1.2}
.par{font:600 1.12rem var(--serif);color:var(--ink)}
.weds{font:italic 500 1.4rem var(--serif);color:var(--gold);margin:6px 0 2px}
.scroll-cue{margin-top:16px;font-size:.82rem;color:var(--maroon);letter-spacing:.08em}
.scroll-cue span{display:block;font-size:1.4rem;animation:bob 1.8s infinite}
@keyframes bob{50%{transform:translateY(6px)}}

.section-intro{max-width:470px;margin:0 auto}
.date-wrap{
  position:relative;margin:24px auto;width:100%;max-width:360px;height:175px;
  color:var(--ink);display:flex;flex-direction:column;justify-content:center
}
.date-wrap .d,.date-wrap .m{visibility:hidden;opacity:0;transition:opacity .45s ease}
.date-wrap.revealed .d,.date-wrap.revealed .m{visibility:visible;opacity:1}
.date-wrap .d{font:600 3.5rem var(--serif);color:var(--maroon)}
.date-wrap .m{font-size:1.05rem;color:var(--muted)}
.date-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
.date-wrap canvas.done{opacity:0;pointer-events:none}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.count div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px}
.count b{display:block;font:600 2rem var(--serif);color:var(--maroon)}
.count span{font-size:.8rem;color:var(--muted)}

.story-card{
  margin:24px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;box-shadow:0 10px 28px rgba(122,31,43,.08)
}
.story-card img{width:100%;display:block}
.caption{padding:16px 20px 20px}
.caption strong{font:600 1.5rem var(--serif);color:var(--maroon)}

.ev{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;margin-top:20px;
  box-shadow:0 8px 22px rgba(122,31,43,.07)
}
.ev h3{font-size:1.55rem;color:var(--maroon)}
.ev .t{color:var(--ink);margin:6px 0}
.ev .v{font:600 1.4rem var(--serif);color:var(--ink)}
.ev .a{font-size:.94rem;margin:4px 0 16px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cross-divider{color:var(--gold);font-size:1.2rem;margin:4px 0}

form{display:grid;gap:18px;text-align:left;margin-top:22px}
label{display:grid;gap:6px;font-size:.95rem;color:var(--ink)}
input[type=text],select{
  font:inherit;padding:13px 14px;border-radius:10px;border:1px solid var(--gold);background:var(--card);color:var(--ink)
}
.choice{display:flex;gap:10px}
.choice label{flex:1;display:block}
.choice input{position:absolute;opacity:0}
.choice span{display:block;text-align:center;padding:13px 8px;border-radius:10px;border:1px solid var(--gold);background:var(--card);cursor:pointer}
.choice input:checked+span{background:var(--maroon);border-color:var(--maroon);color:var(--bg)}
.note{font-size:.9rem;margin-top:14px;min-height:1.4em}

.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:24px;text-align:left}
.wall .card{
  background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 4px;padding:14px 16px;
  box-shadow:0 6px 16px rgba(122,31,43,.1);transform:rotate(var(--r,-1deg));
  animation:cardIn .5s ease both
}
.wall .card p{color:var(--ink);font-style:italic;font-size:.95rem}
.wall .card b{display:block;margin-top:8px;color:var(--maroon);font-family:var(--serif);font-size:1.05rem}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) rotate(var(--r,-1deg)) scale(.96)}to{opacity:1;transform:translateY(0) rotate(var(--r,-1deg)) scale(1)}}

.music{
  position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:70;width:46px;height:46px;
  padding:0;font-size:1.3rem;line-height:46px;text-align:center;background:var(--bg);color:var(--maroon);border:1.5px solid var(--maroon)
}
.music[aria-pressed=true]{background:var(--maroon);color:var(--bg)}

.rose-rain{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:8;
  transition:opacity 1s ease;
}
.rose-rain.off{opacity:0}
.burst-layer{z-index:75}

/* ---- Background videos (muted, lazy, play only while on screen) ---- */
.sea{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(#cfeaee,#8fcad4)}
.sea-bg{position:absolute;inset:0;z-index:-2}
.sea-bg video{position:sticky;top:0;display:block;width:100%;height:100vh;height:100svh;object-fit:cover}
.sea:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to bottom,var(--bg) 0,rgba(255,250,242,.36) 10%,rgba(255,250,242,.28) 90%,var(--bg) 100%)
}
.sea>section{border-top:0}
.sea h2{display:inline-block;background:rgba(255,250,242,.88);padding:8px 28px 4px;border-radius:22px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sea h2:after{margin-top:3px}

.finale{
  position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;isolation:isolate;background:#3a1a1c;border-top:0;
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 84px)
}
.finale .bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.finale:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to bottom,rgba(40,12,16,.4) 0,rgba(40,12,16,0) 28%,rgba(40,12,16,0) 50%,rgba(40,12,16,.8) 100%)
}
.finale-text{position:relative;max-width:420px}
.finale p{color:#fff4e4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.finale .sig{font:400 clamp(2.2rem,10vw,3rem) var(--script);color:#fff;line-height:1.3;white-space:nowrap}
.finale .amp{color:var(--gold2)}

footer{padding:48px 24px 72px;text-align:center;border-top:1px solid var(--line)}
footer p{margin-top:6px}
footer .sig{font:400 2.5rem var(--script);color:var(--maroon);line-height:1.3}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.reveal.visible{opacity:1;transform:none}

.floating-cross{
  position:fixed;right:8px;bottom:100px;color:rgba(122,31,43,.14);font-size:2rem;z-index:1;
  animation:floatCross 5s ease-in-out infinite;pointer-events:none
}
@keyframes floatCross{50%{transform:translateY(-15px) rotate(5deg)}}

.floating-violin{
  position:fixed;left:10px;bottom:170px;opacity:.16;font-size:1.6rem;z-index:1;
  animation:floatCross 6.5s ease-in-out infinite reverse;pointer-events:none
}

/* ---- Guestbook: floating wishes board ---- */
.gb-board{
  position:relative;margin-top:26px;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 0,rgba(224,184,79,.25),transparent 62%),linear-gradient(#fffdf8,#f7ecd8);
  box-shadow:inset 0 0 40px rgba(184,134,11,.12)
}
.gb-sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.gb-sky span{
  position:absolute;left:var(--l);bottom:-30px;font-size:var(--s);color:var(--c);opacity:0;
  animation:skyUp var(--t) linear var(--dl) infinite
}
@keyframes skyUp{
  0%{opacity:0;transform:translate(0,0) rotate(0)}
  12%{opacity:.55}
  85%{opacity:.35}
  100%{opacity:0;transform:translate(var(--sw),-560px) rotate(40deg)}
}
.gb-board .wall{
  position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:22px 14px;margin:0;
  padding:26px 14px 20px;max-height:540px;overflow-y:auto;overscroll-behavior:contain
}
.gb-board .wall .card{
  position:relative;flex:0 1 150px;min-width:130px;
  animation:cardIn .5s ease both,noteBob var(--bd,5s) ease-in-out var(--bdelay,0s) infinite alternate
}
.gb-board .wall .card:before{
  content:"";position:absolute;top:-7px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0d27a,#b8860b);box-shadow:0 2px 4px rgba(90,20,32,.35)
}
@keyframes noteBob{from{translate:0 0}to{translate:0 -7px}}
.wall .card.c1{background:#fde8ea}
.wall .card.c2{background:#fff1c9}
.wall .card.c3{background:#e4f1e4}
.wall .card img{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:10px;border:1px solid var(--line);background:#fff}
.gb-board .wall .card.has-img{flex-basis:230px}
/* ---- Sticker picker + stickers on notes ---- */
.stk-wrap{display:grid;gap:8px}
.stk-title{font-size:.95rem;color:var(--ink)}
.stk-wrap input[type=search]{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--gold);background:var(--card);color:var(--ink)}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;max-height:184px;overflow-y:auto;padding:4px;overscroll-behavior:contain}
.stk-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:12px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font:500 .72rem var(--sans);line-height:1.2}
.stk-tile svg,.stk-tile img{width:40px;height:40px;object-fit:contain;display:block}
.stk-tile[aria-pressed=true]{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,31,43,.18);background:#fff}
.stk-none{grid-column:1/-1;text-align:center;color:var(--muted);font-style:italic;padding:12px}
.stk-picked{font-size:.85rem;color:var(--maroon);min-height:1.2em}
.card .stk{display:block;width:84px;height:84px;margin:0 auto 8px}
.card .stk svg{width:100%;height:100%;display:block}
.wall .card .stk-photo{width:130px;height:auto;max-width:100%;margin:0 auto 8px;border-radius:10px;border:1px solid var(--line);background:#fff}
.gb-empty{position:relative;z-index:1;padding:46px 20px;font-style:italic;color:var(--muted)}
.gb-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 14px;font-size:.85rem;background:var(--card);color:var(--maroon);border:1px solid var(--gold)}
.gb-colors{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--ink)}
.gb-colors>span{margin-right:4px}
.dot{position:relative;width:34px;height:34px;display:block}
.dot input{position:absolute;opacity:0;inset:0}
.dot span{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.dot input:checked+span{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,31,43,.2)}
.dot input:focus-visible+span{outline:3px solid var(--maroon);outline-offset:2px}

/* ---- Video behind "Celebrate with us" ---- */
.joyvid{position:relative;overflow:hidden;isolation:isolate;background:var(--bg2);border-top:1px solid var(--line)}
.joyvid .bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-2}
.joyvid:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to bottom,var(--bg) 0,rgba(255,250,242,.5) 14%,rgba(255,250,242,.42) 86%,var(--bg) 100%)
}
.joyvid>section{border-top:0}
.joyvid h2{display:inline-block;background:rgba(255,250,242,.9);padding:8px 28px 4px;border-radius:22px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.joyvid h2:after{margin-top:3px}
.joyvid .section-intro{background:rgba(255,250,242,.88);padding:14px 18px;border-radius:16px;color:var(--ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* ---- Rings animation (replaces RSVP) ---- */
.rings{position:relative;width:min(100%,300px);margin:18px auto 12px;height:180px}
.rings svg{width:100%;display:block;overflow:visible}
.ring circle{fill:none;stroke:url(#goldGrad);stroke-width:9}
.ring-l{animation:ringL 5s ease-in-out infinite}
.ring-r{animation:ringR 5s ease-in-out infinite}
@keyframes ringL{0%,8%{transform:translateX(-46px)}42%,78%{transform:translateX(0)}100%{transform:translateX(-46px)}}
@keyframes ringR{0%,8%{transform:translateX(46px)}42%,78%{transform:translateX(0)}100%{transform:translateX(46px)}}
.sparkle{fill:var(--gold2);transform-box:fill-box;transform-origin:center;opacity:0;animation:spark 5s ease-in-out infinite}
@keyframes spark{0%,40%{opacity:0;transform:scale(0) rotate(0)}52%{opacity:1;transform:scale(1.25) rotate(45deg)}70%{opacity:1;transform:scale(1) rotate(90deg)}85%,100%{opacity:0;transform:scale(0) rotate(135deg)}}
.rings .h{
  position:absolute;left:50%;bottom:10px;color:#c4455a;font-size:1.1rem;opacity:0;pointer-events:none;
  animation:heartUp 4s ease-in infinite;animation-delay:var(--d)
}
@keyframes heartUp{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  15%{opacity:.9}
  100%{opacity:0;transform:translate(var(--x),-130px) scale(1.15)}
}

@media (prefers-reduced-motion:reduce){
  .gb-sky{display:none}
  .gb-board .wall .card{animation:none}
}
@media (prefers-reduced-motion:reduce){
  .ring-l,.ring-r,.sparkle,.rings .h{animation:none}
  .sparkle{opacity:1}
  .rings .h{display:none}
}
@media (prefers-reduced-motion:reduce){
  .cover,.hero-art,.waxseal,.scroll-cue span,.floating-cross,.floating-violin,.reveal,.speech-bubble{animation:none;transition:none}
  .cover-bg{display:none}
}
@media(max-width:390px){
  section{padding-left:18px;padding-right:18px}
  .count{gap:6px}
  .count b{font-size:1.55rem}
  .count span{font-size:.72rem}
}
</style>
</head>
<body class="locked">

<canvas id="roseRain" class="rose-rain" aria-hidden="true"></canvas>

    const b=document.createElement("b"); b.textContent="— "+entry.name;
    if(entry.img){
      const im=document.createElement("img");
      im.src=entry.img; im.alt=entry.alt||""; im.loading="lazy"; im.decoding="async";
      card.append(im);
    }
    const st=STK_MAP[entry.s];   // only known sticker ids are drawn; anything else is ignored
    if(st){
      if(st.img){
        const si=document.createElement("img"); si.className="stk-photo"; si.src=st.img; si.alt=st.en; si.loading="lazy"; si.decoding="async";
        card.append(si);
      }else{
        const sd=document.createElement("div"); sd.className="stk"; sd.setAttribute("role","img"); sd.setAttribute("aria-label",st.en); sd.innerHTML=st.svg;
        card.append(sd);
      }
    }
    card.append(p,b);
    if(!animate) card.style.animation="noteBob var(--bd) ease-in-out var(--bdelay) infinite alternate";
    const ref=wall.children[index];
    if(ref) wall.insertBefore(card,ref); else wall.appendChild(card);
    const live=[...wall.querySelectorAll(".card:not(.seed)")];   // only live guest notes are capped; starter notes stay
    while(live.length>GB_MAX) live.pop().remove();
    gbSyncEmpty();
  }
  function gbFallback(){
    gbRemote=null; gbLoaded=true;
    const wall=$("gbWall"); wall.innerHTML="";
    gbLoad().slice().reverse().forEach((en,i)=>gbAdd(en,null,i,false));
    gbRenderSeeds();
    $("gbNote").textContent=T[lang].gbOffline;
    gbSyncEmpty();
  }
  async function gbStart(){
    if(gbStarted) return;
    gbStarted=true;
    try{
      const [appMod,fs]=await Promise.all([import(GB_FB+"firebase-app.js"),import(GB_FB+"firebase-firestore.js")]);
      const db=fs.getFirestore(appMod.initializeApp(CONFIG.firebase));
      const col=fs.collection(db,"wishes");
      gbRemote={fs,col};
      let first=true;
      fs.onSnapshot(fs.query(col,fs.orderBy("t","desc"),fs.limit(GB_MAX)),snap=>{
        snap.docChanges().forEach(ch=>{
          const wall=$("gbWall");
          if(ch.type==="added"){
            const d=ch.doc.data();
            if(wall.querySelector('[data-id="'+ch.doc.id+'"]')) return;
            gbAdd({name:d.name,msg:d.msg,c:d.c,s:d.s},ch.doc.id,ch.newIndex,!first);
          }else if(ch.type==="removed"){
            const el=wall.querySelector('[data-id="'+ch.doc.id+'"]'); if(el) el.remove();
          }
        });
        first=false; gbLoaded=true; gbSyncEmpty();
      },()=>gbFallback());
    }catch(e){ gbFallback(); }
  }
  (function initGuestbook(){
    const board=$("gbBoard"); if(!board) return;
    gbRenderSeeds();
    $("stkSearch").addEventListener("input",e=>{ stk.q=e.target.value; renderStickers(); });
    // load the shared wall only when the guestbook is about to be seen (saves data and Firebase reads)
    if("IntersectionObserver" in window){
      new IntersectionObserver((es,o)=>{ if(es.some(x=>x.isIntersecting)){ o.disconnect(); gbStart(); } },{rootMargin:"500px 0px"}).observe(board);
    }else gbStart();
    $("gbForm").onsubmit=async e=>{
      e.preventDefault();
      const name=$("gbName").value.trim(), msg=$("gbWish").value.trim();
      const chosen=document.querySelector("input[name=gbColor]:checked");
      const c=chosen?+chosen.value:0;
      if(!name||!msg) return;
      let last=0; try{ last=+localStorage.getItem("gbLast")||0; }catch(err){}
      if(Date.now()-last<GB_COOLDOWN){ $("gbNote").textContent=T[lang].gbWait; return; }
      $("gbSubmit").disabled=true;
      await gbStart();
      if(gbStarted && !gbLoaded){ await new Promise(r=>{ const t=setInterval(()=>{ if(gbLoaded){clearInterval(t);r();} },100); setTimeout(()=>{clearInterval(t);r();},4000); }); }
      try{
        if(gbRemote){
          const {fs,col}=gbRemote;
          // not awaited: the new note appears instantly; an error message shows only if the server rejects it
          const wish={name,msg,c,t:fs.serverTimestamp()}; if(stk.sel) wish.s=stk.sel;
          fs.addDoc(col,wish).catch(()=>{ $("gbNote").textContent=T[lang].gbErr; });
        }else{
          const s=stk.sel, list=gbLoad(); list.push(s?{name,msg,c,s}:{name,msg,c}); gbSave(list);
          gbAdd({name,msg,c,s},null,0,true);
        }
        try{ localStorage.setItem("gbLast",String(Date.now())); }catch(err){}
        $("gbForm").reset();
        stk.sel=""; stk.q=""; renderStickers();
        $("gbWall").scrollTop=0;
        $("gbNote").textContent=T[lang].gbSent;
        if(CONFIG.whatsappOnWish) window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Guestbook wish from "+name+": "+msg),"_blank");
      }catch(err){ $("gbNote").textContent=T[lang].gbErr; }
      $("gbSubmit").disabled=false;
    };
  })();

  // Floating hearts / sparkles drifting up behind the notes
  (function initGuestbookSky(){
    const sky=$("gbSky"); if(!sky) return;
    const glyphs=["♥","✦","❀","♥","✿"], cols=["#c4455a","#e0b84f","#b8860b","#d97b8a"];
    for(let i=0;i<18;i++){
      const s=document.createElement("span");
      s.textContent=glyphs[i%glyphs.length];
      s.style.setProperty("--l",(Math.random()*94).toFixed(1)+"%");
      s.style.setProperty("--s",(10+Math.random()*16).toFixed(0)+"px");
      s.style.setProperty("--t",(9+Math.random()*9).toFixed(1)+"s");
      s.style.setProperty("--dl",(-Math.random()*14).toFixed(1)+"s");
      s.style.setProperty("--c",cols[i%cols.length]);
      s.style.setProperty("--sw",(Math.random()*50-25).toFixed(0)+"px");
      sky.appendChild(s);
    }
  })();

  // Music
  const bgm=$("bgm"), mbtn=$("musicBtn");
  let wantMusic=false;
  if(CONFIG.music){
    bgm.src=CONFIG.music;bgm.volume=CONFIG.musicVolume;
  }else{
    mbtn.hidden=true;
  }
  function syncMusic(){mbtn.setAttribute("aria-pressed",wantMusic)}
  function setMusic(on){
    wantMusic=on;syncMusic();
    if(on){const p=bgm.play();if(p&&p.catch)p.catch(()=>{wantMusic=false;syncMusic()})}
    else bgm.pause();
  }
  mbtn.onclick=()=>setMusic(!wantMusic);

  // Scroll reveal
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add("visible")});
  },{threshold:.12});
  document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));

  // Background videos (sea waves + couple): load late, play only while on screen
  (function initBgVideos(){
    const saveData = navigator.connection && navigator.connection.saveData;
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches || saveData || !("IntersectionObserver" in window)) return;
    document.querySelectorAll(".bgvid").forEach(v=>{
      v.addEventListener("error",()=>v.remove());
      const wrap = v.closest("[data-vidwrap]") || v;
      new IntersectionObserver(entries=>{
        entries.forEach(e=>{
          if(e.isIntersecting){
            if(!v.getAttribute("src")) v.src = v.dataset.src;
            const p = v.play(); if(p && p.catch) p.catch(()=>{});
          }else v.pause();
        });
      },{rootMargin:"200px 0px"}).observe(wrap);
    });
  })();

  // Rose petal rain (fades out before "Our Wedding", returns if you scroll back up)
  (function initRoseRain(){
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const canvas = $("roseRain");
    const ctx2 = canvas.getContext("2d");
    if(!ctx2) return;

    const petals = [];
    const isMobile = window.innerWidth < 600;
    const maxPetals = isMobile
      ? Math.min(22, Math.max(12, Math.floor(window.innerWidth / 38)))
      : Math.min(56, Math.max(26, Math.floor(window.innerWidth / 24)));
    let w = 0, h = 0, dpr = 1;
    let animId = 0;
    let allowed = true, offTimer = 0;

    function rand(min, max){ return Math.random() * (max - min) + min; }

    function makePetal(resetToTop){
      return {
        x: rand(0, w),
        y: resetToTop ? rand(-h, 0) : rand(0, h),
        size: rand(7, 15),
        speedY: rand(0.6, 1.8),
        sway: rand(0.4, 1.8),
        angle: rand(0, Math.PI * 2),
        rot: rand(-0.02, 0.02),
        drift: rand(-0.35, 0.35),
        hue: rand(343, 356),
        sat: rand(62, 78),
        light: rand(45, 62),
        alpha: rand(0.45, 0.85)
      };
    }

    function resize(){
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawPetal(p){
      ctx2.save();
      ctx2.translate(p.x, p.y);
      ctx2.rotate(p.angle);
      const g = ctx2.createLinearGradient(-p.size, -p.size, p.size, p.size);
      g.addColorStop(0, "hsla("+p.hue+","+p.sat+"%,"+(p.light + 8)+"%,"+p.alpha+")");
      g.addColorStop(1, "hsla("+p.hue+","+(p.sat - 12)+"%,"+(p.light - 10)+"%,"+Math.max(0.22, p.alpha - 0.18)+")");
      ctx2.fillStyle = g;
      ctx2.beginPath();
      ctx2.moveTo(0, -p.size);
      ctx2.bezierCurveTo(p.size * 0.9, -p.size * 0.2, p.size * 0.7, p.size, 0, p.size * 0.85);
      ctx2.bezierCurveTo(-p.size * 0.7, p.size, -p.size * 0.9, -p.size * 0.2, 0, -p.size);
      ctx2.fill();
      ctx2.restore();
    }

    function step(){
      ctx2.clearRect(0, 0, w, h);
      for(let i = 0; i < petals.length; i++){
        const p = petals[i];
        p.y += p.speedY;
        p.x += Math.sin(p.y * 0.02 + p.sway) * 0.45 + p.drift;
        p.angle += p.rot;
        if(p.y > h + 20 || p.x < -30 || p.x > w + 30){
          petals[i] = makePetal(true);
          petals[i].y = -20;
        }
        drawPetal(petals[i]);
      }
      animId = requestAnimationFrame(step);
    }

    function setRunning(run){
      if(run && !animId) animId = requestAnimationFrame(step);
      if(!run && animId){ cancelAnimationFrame(animId); animId = 0; }
    }

    // fade petals out (and stop drawing) once "Our Wedding" comes into view
    function setAllowed(v){
      if(v === allowed) return;
      allowed = v;
      canvas.classList.toggle("off", !v);
      clearTimeout(offTimer);
      if(v) setRunning(!document.hidden);
      else offTimer = setTimeout(()=>setRunning(false), 1100);
    }
    const storySec = $("storySec");
    if(storySec && "IntersectionObserver" in window){
      new IntersectionObserver(entries=>{
        const e = entries[0];
        setAllowed(!e.isIntersecting && e.boundingClientRect.top > 0);
      },{rootMargin:"0px 0px -35% 0px"}).observe(storySec);
    }

    resize();
    for(let i = 0; i < maxPetals; i++) petals.push(makePetal(false));
    setRunning(true);

    window.addEventListener("resize", resize, { passive: true });
    document.addEventListener("visibilitychange", ()=>setRunning(allowed && !document.hidden));
  })();
})();
</script>
